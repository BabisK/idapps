name: build release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without a v prefix
        required: true
        type: string
      publish:
        description: Publish the verified assets to the matching existing GitHub tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v ./... -args '-ginkgo.v'
      - run: go vet ./...
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-26.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-26.04-arm}
          - {goos: windows, goarch: amd64, runner: windows-2025}
          - {goos: windows, goarch: arm64, runner: windows-2025}
          - {goos: darwin, goarch: arm64, runner: macos-26}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build portable executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          suffix=""
          [[ "$TARGET_OS" != windows ]] || suffix=.exe
          name="idapps-${RELEASE_VERSION}-${TARGET_OS}-${TARGET_ARCH}${suffix}"
          mkdir -p dist
          ldflags="-s -w"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == "v$RELEASE_VERSION" ]]; then
            ldflags="$ldflags -X main.version=$RELEASE_VERSION"
          fi
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "$ldflags" -o "dist/$name" .
          echo "ASSET=dist/$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: idapps-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
  checksums:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist
          assets=(
            "idapps-${RELEASE_VERSION}-linux-amd64"
            "idapps-${RELEASE_VERSION}-linux-arm64"
            "idapps-${RELEASE_VERSION}-windows-amd64.exe"
            "idapps-${RELEASE_VERSION}-windows-arm64.exe"
            "idapps-${RELEASE_VERSION}-darwin-arm64"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          cp ../LICENSE ../README.md .
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: checksums
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Verify release tag and assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$REF_TYPE" == tag && "$REF_NAME" == "v$RELEASE_VERSION" ]]
          [[ "$(git rev-parse "refs/tags/$REF_NAME^{commit}")" == "$EXPECTED_SHA" ]]
          (cd dist && sha256sum --check SHA256SUMS)
          test -f dist/LICENSE
          test -f dist/README.md
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" --verify-tag --title "IDApps $RELEASE_VERSION" --generate-notes dist/*
